name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  # `github.ref`, not `head_ref || ref_name`: those two put a branch named
  # `4.4.3-7` and a tag named `4.4.3-7` into the same concurrency group, and this
  # repository's tags are <senzing_version>-<build>. `github.ref` cannot collide.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    uses: senzing-factory/build-resources/.github/workflows/claude-pull-request-review.yaml@70dab644cea895c2091e059b2e904ba9866e11d6 # 4.5.1
    permissions:
      contents: read
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
