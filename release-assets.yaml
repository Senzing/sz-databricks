# The files of an sz-databricks release, as scripts/check_release_assets.sh checks them before
# SHA256SUMS is signed. Flat on purpose (scripts/build_yaml.sh reads one key at a time).
# {release} is the tag, <senzing_version>-<build> (e.g. 4.4.3-7); {arch} is each of release_archs.
---
release_native_archive: "sz-databricks-engine-native-{release}-linux-{arch}.tar.gz"
release_shared_archive: "sz-databricks-engine-shared-{release}.tar.gz"
release_bundle_archive: "sz-databricks-bundle-{release}.tar.gz"
release_sums: SHA256SUMS
release_archs: "aarch64 x86_64"
# Every file of the bundle tarball (directories aside); app/ holds the App binary, lib/ the engine and watcher JARs.
bundle_members: "bundle/app/.gitignore bundle/app/sz-databricks-app bundle/dashboards/sz_status.lvdash.json bundle/databricks.yml bundle/lib/.gitignore bundle/lib/sz-databricks-engine-{release}.jar bundle/lib/sz-databricks-watch-{release}.jar bundle/resources/app.yml bundle/resources/dashboard.yml bundle/resources/jobs.yml bundle/resources/lakebase.yml bundle/resources/schema.yml bundle/resources/secrets.yml bundle/resources/volume.yml bundle/resources/warehouse.yml bundle/resources/watch.yml bundle/scripts/admin.sh bundle/scripts/install.sh bundle/scripts/lakebase-setup.sql bundle/scripts/node-sizing.sh bundle/scripts/node-sizing.yaml bundle/scripts/verify-release.sh"
bundle_app_jar: "bundle/lib/sz-databricks-engine-{release}.jar"
# Every file of the engine JAR (bundle_app_jar) under these directories: the contract and the release facts setup trusts.
jar_dirs: "contract release"
jar_members: "contract/contract.yaml contract/lakebase-setup.sql contract/mart_comments.yaml release/payload-digests.txt release/release-repo.txt"
# release/payload-digests.txt lists the payload archives and this file of the shared archive.
payload_manifest: payload.sha256
